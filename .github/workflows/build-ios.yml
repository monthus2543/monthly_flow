name: Build iOS for AltStore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package IPA for AltStore
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/ios/iphoneos/Runner.app"
          test -d "$APP_PATH"

          mkdir -p build/altstore/Payload
          cp -R "$APP_PATH" build/altstore/Payload/

          cd build/altstore
          zip -r -y app-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-altstore
          path: build/altstore/app-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
